<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 400px;
            width: 100%;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            color: #999;
            font-size: 14px;
        }

        .display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        #display-input {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            font-size: 36px;
            text-align: right;
            outline: none;
            font-weight: 500;
            letter-spacing: 2px;
        }

        #display-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 15px;
        }

        .button {
            padding: 20px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f0f0f0;
            color: #333;
        }

        .button:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .button:active {
            transform: translateY(0);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .button.operator {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .button.operator:hover {
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .button.equals {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            grid-column: span 2;
        }

        .button.equals:hover {
            box-shadow: 0 5px 15px rgba(245, 87, 108, 0.4);
        }

        .button.clear {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            grid-column: span 2;
        }

        .button.clear:hover {
            box-shadow: 0 5px 15px rgba(250, 112, 154, 0.4);
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 12px;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            .button {
                padding: 15px;
                font-size: 16px;
            }

            #display-input {
                font-size: 28px;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Calculator</h1>
            <p>Simple & Fast Calculations</p>
        </div>

        <div class="display">
            <input type="text" id="display-input" placeholder="0" readonly>
        </div>

        <div class="button-grid">
            <button class="button clear" onclick="clearDisplay()">C</button>
            <button class="button operator" onclick="appendOperator('/')" title="Divide">÷</button>
            <button class="button operator" onclick="appendOperator('*')" title="Multiply">×</button>

            <button class="button" onclick="appendNumber('7')">7</button>
            <button class="button" onclick="appendNumber('8')">8</button>
            <button class="button" onclick="appendNumber('9')">9</button>
            <button class="button operator" onclick="appendOperator('-')" title="Subtract">−</button>

            <button class="button" onclick="appendNumber('4')">4</button>
            <button class="button" onclick="appendNumber('5')">5</button>
            <button class="button" onclick="appendNumber('6')">6</button>
            <button class="button operator" onclick="appendOperator('+')" title="Add">+</button>

            <button class="button" onclick="appendNumber('1')">1</button>
            <button class="button" onclick="appendNumber('2')">2</button>
            <button class="button" onclick="appendNumber('3')">3</button>
            <button class="button operator" onclick="appendNumber('.')">.</button>

            <button class="button" onclick="appendNumber('0')" style="grid-column: span 2;">0</button>
            <button class="button equals" onclick="calculate()">=</button>
        </div>

        <div class="footer">
            <p>Created with ❤️ by <a href="https://github.com/khokon143">@khokon143</a></p>
        </div>
    </div>

    <script>
        let display = document.getElementById('display-input');
        let currentValue = '';

        function appendNumber(num) {
            currentValue += num;
            updateDisplay();
        }

        function appendOperator(op) {
            if (currentValue === '') return;
            if (/[+\-*/.]$/.test(currentValue)) {
                currentValue = currentValue.slice(0, -1) + op;
            } else {
                currentValue += op;
            }
            updateDisplay();
        }

        function clearDisplay() {
            currentValue = '';
            updateDisplay();
        }

        function calculate() {
            try {
                if (currentValue === '') return;
                let result = eval(currentValue);
                currentValue = result.toString();
                updateDisplay();
            } catch (error) {
                display.value = 'Error';
                currentValue = '';
            }
        }

        function updateDisplay() {
            display.value = currentValue || '0';
        }

        // Allow keyboard input
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') appendNumber(e.key);
            if (e.key === '+' || e.key === '-' || e.key === '*' || e.key === '/') appendOperator(e.key);
            if (e.key === '.' ) appendNumber('.');
            if (e.key === 'Enter') calculate();
            if (e.key === 'Backspace') {
                currentValue = currentValue.slice(0, -1);
                updateDisplay();
            }
            if (e.key === 'Escape') clearDisplay();
        });

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
