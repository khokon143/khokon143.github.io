
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bijoy WiFi - Internet Card</title>
    <meta name="description"
          content="Buy your Bijoy WiFi internet card">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172033;
        }

        header {
            text-align: center;
            padding: 22px 15px;
            background: #ffffff;
        }

        #bijoyImg {
            width: 150px;
            max-width: 80%;
            height: auto;
            object-fit: contain;
        }

        .hero {
            background: #075985;
            color: white;
            text-align: center;
            padding: 28px 16px;
        }

        .hero h1 {
            margin: 0 0 10px;
            font-size: 25px;
        }

        .hero p {
            margin: 0;
            line-height: 1.7;
        }

        .container {
            width: min(440px, 92%);
            margin: 24px auto;
        }

        .form-card {
            background: white;
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 5px 22px #00000012;
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 15px 0 7px;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font-size: 16px;
            background: white;
        }

        input:focus, select:focus {
            outline: 2px solid #38bdf8;
            border-color: #0284c7;
        }

        .price-box {
            background: #e0f2fe;
            padding: 14px;
            border-radius: 10px;
            text-align: center;
            margin-top: 16px;
            font-size: 17px;
        }

        #price {
            color: #075985;
            font-size: 24px;
            font-weight: bold;
        }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #0284c7;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0369a1;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #status {
            margin-top: 15px;
            text-align: center;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        footer {
            text-align: center;
            color: #64748b;
            padding: 20px 10px;
            font-size: 13px;
        }
        #Note {
            color: red;
        }
    </style>
</head>

<body>

    <header>
        <img
            id="bijoyImg"
            src="153FF48C88668AF5E9AA546BD1C744F3_logo_Bijoy_Maxim.jpg"
            alt="Bijoy WiFi Logo">
    </header>

    <section class="hero">
        <p>
            দ্রুতগতির WiFi ইন্টারনেট<br>
            সহজে প্যাকেজ কিনুন, সংযুক্ত থাকুন।
        </p>
        <p id="Note">
            Note: আপনার সচল ফোন নাম্বারটি দিন, আমরা অতিদ্রুত আপনার কার্ডটি এসএমএস পাঠাবো
        </p>
    </section>

    <main class="container">
        <div class="form-card">
            <h2>Buy Internet Card</h2>

            <form id="orderForm">

                <label for="customerName">আপনার নাম</label>
                <input
                    id="customerName"
                    type="text"
                    placeholder="আপনার নাম লিখুন"
                    maxlength="60"
                    autocomplete="name"
                    required>

                <label for="phone">মোবাইল নম্বর</label>
                <input
                    id="phone"
                    type="tel"
                    placeholder="01XXXXXXXXX"
                    inputmode="numeric"
                    pattern="01[0-9]{9}"
                    maxlength="11"
                    autocomplete="tel"
                    required>

                <label for="package">ইন্টারনেট প্যাকেজ</label>
                <select id="package" required>
                    <option value="">প্যাকেজ নির্বাচন করুন</option>
                    <option value="1 day" data-price="10">
                        ১ দিন - ১০ টাকা
                    </option>
                    <option value="5 Day" data-price="34">
                        ১ দিন - ৩৪ টাকা
                    </option>
                    <option value="7 Days" data-price="44">
                        ৭ দিন -৪৪ টাকা
                    </option>
                    <option value="30 Days" data-price="114">
                        ৩০ দিন - ১১৪ টাকা
                    </option>
                </select>

                <div class="price-box">
                    <div id="price">৳ ০</div>
                    <p>বিকাসে সেন্ড মানি করুন</p>
                    <p>01868640689</p>
                </div>
                
                                <label for="customerName">আপনার লেনদেন তথ্য জমা দিন</label>
                <input
                    id="customerTrx"
                    type="text"
                    placeholder="আপনার TRX ID লিখুন"
                    maxlength="60"
                    autocomplete="nameTrx"
                    required>
                    

                <button id="buyButton" type="submit">
                    Buy Now
                </button>

                <p id="status" role="status" aria-live="polite"></p>

            </form>
        </div>
    </main>

    <footer>
        © 2026 Bijoy WiFi. All rights reserved.
    </footer>

    <script>
        // Telegram configuration
        // Demo only: a browser-based token is publicly exposed.
        const BOT_TOKEN = "8805622219:AAFHgQUBDkiPcpWNWv0IW4Oz5C652SRGlTU";
        const CHAT_ID = "8986204069";

        const form = document.getElementById("orderForm");
        const packageSelect = document.getElementById("package");
        const priceDisplay = document.getElementById("price");
        const statusBox = document.getElementById("status");
        const buyButton = document.getElementById("buyButton");

        function getSelectedPrice() {
            const option =
                packageSelect.options[packageSelect.selectedIndex];

            return Number(option.dataset.price || 0);
        }

        packageSelect.addEventListener("change", function () {
            const price = getSelectedPrice();
            priceDisplay.textContent =
                "৳ " + price.toLocaleString("en-US");
        });

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            const name =
                document.getElementById("customerName").value.trim();
                

            const phone =
                document.getElementById("phone").value.trim();
                
            const nameTrx =
                document.getElementById("customerTrx").value.trim();

            const selectedPackage = packageSelect.value;
            const price = getSelectedPrice();

            if (!name || !phone || !selectedPackage || price <= 0) {
                statusBox.textContent =
                    "সব তথ্য পূরণ করে প্যাকেজ নির্বাচন করুন।";
                return;
            }

            if (
                BOT_TOKEN === "YOUR_BOT_TOKEN" ||
                CHAT_ID === "YOUR_CHAT_ID"
            ) {
                statusBox.textContent =
                    "প্রথমে Telegram Bot Token ও Chat ID সেট করুন।";
                return;
            }

            // User-entered values are sent as plain text.
            const message = [
                "🛒 NEW WIFI CARD ORDER",
                "",
                "👤 Name: " + name,
                "📱 Phone: " + phone,
                "Trx-id: " + nameTrx,
                "📦 Package: " + selectedPackage,
                "💰 Price: Tk " + price,
                "📌 Status: Pending"
            ].join("\n");

            buyButton.disabled = true;
            buyButton.textContent = "Sending...";
            statusBox.textContent = "অর্ডার পাঠানো হচ্ছে...";

            try {
                const response = await fetch(
                    "https://api.telegram.org/bot" +
                    BOT_TOKEN + "/sendMessage",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            chat_id: CHAT_ID,
                            text: message
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok || !result.ok) {
                    throw new Error("Telegram request failed");
                }

                statusBox.textContent =
                    "✅ অর্ডার সফলভাবে পাঠানো হয়েছে! " +
                    "কার্ডের জন্য অপেক্ষা করুন।";

                form.reset();
                priceDisplay.textContent = "৳ ০";

            } catch (error) {
                statusBox.textContent =
                    "❌ অর্ডার পাঠানো যায়নি। পরে আবার চেষ্টা করুন।";
                console.error("Order request failed");
            } finally {
                buyButton.disabled = false;
                buyButton.textContent = "Buy Now";
            }
        });
    </script>

</body>
</html>
